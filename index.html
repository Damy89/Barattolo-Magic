<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Barattolo della Coppia</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase JS SDK (v10 Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #4c0519 100%);
      min-height: 100vh;
      color: #f3f4f6;
      user-select: none;
    }

    .font-fredoka {
      font-family: 'Fredoka', cursive;
    }

    /* Glassmorphism Jar Effect */
    .glass-jar {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 3px solid rgba(255, 255, 255, 0.25);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        inset 0 0 25px rgba(255, 255, 255, 0.15),
        inset -10px -10px 20px rgba(0, 0, 0, 0.3);
      border-radius: 40px 40px 60px 60px;
    }

    .jar-lid {
      background: linear-gradient(180deg, #d4af37 0%, #aa7c11 100%);
      box-shadow: 0 6px 15px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.4);
      border: 1px solid #fef08a;
    }

    /* Floating tickets inside jar */
    @keyframes float-ticket {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }

    .animate-float {
      animation: float-ticket 3s ease-in-out infinite;
    }

    /* Jar Shake Animation */
    @keyframes jar-shake {
      0% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(-8deg) scale(1.03); }
      30% { transform: rotate(8deg) scale(1.03); }
      45% { transform: rotate(-6deg) scale(1.03); }
      60% { transform: rotate(6deg) scale(1.03); }
      75% { transform: rotate(-3deg) scale(1.01); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .shaking {
      animation: jar-shake 0.8s ease-in-out;
    }

    /* Pulse Glow */
    .glow-red {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
    }
    .glow-blue {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <div id="root" class="flex-grow flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- CONFIGURAZIONE FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBLUguJz3tNSN5pgc1DQqpcaqp5rdvli2c",
      authDomain: "magic-barattolo.firebaseapp.com",
      projectId: "magic-barattolo",
      storageBucket: "magic-barattolo.firebasestorage.app",
      messagingSenderId: "841513695792",
      appId: "1:841513695792:web:12fe584fd1eaea77780bf5"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const initialTickets = [
      { id: '1', createdBy: 'lei', target: 'lui', text: 'Cena a lume di candela preparata da te!', penalty: 'Devi lavare tutti i piatti per una settimana intera.', expiresHours: 24, createdAt: null },
      { id: '2', createdBy: 'lei', target: 'lui', text: 'Massaggio alla schiena di 20 minuti senza protestare', penalty: 'Devi fare 30 flessioni subito!', expiresHours: 12, createdAt: null },
      { id: '3', createdBy: 'lei', target: 'lui', text: 'Portami il mio dolce preferito stasera', penalty: 'Devi offrire il prossimo aperitivo in un locale chic', expiresHours: 6, createdAt: null },
      { id: '4', createdBy: 'lui', target: 'lei', text: 'Serata film: scegli tu il film e io preparo i popcorn!', penalty: 'Devi vederti la partita di calcio con me senza sbuffare.', expiresHours: 48, createdAt: null },
      { id: '5', createdBy: 'lui', target: 'lei', text: 'Colazione a letto questo fine settimana', penalty: 'Devi farmi un grattino sulla testa per 15 minuti!', expiresHours: 36, createdAt: null },
      { id: '6', createdBy: 'lui', target: 'lei', text: 'Passeggiata romantica al tramonto', penalty: 'Devi cucinare la tua specialità entro domani sera', expiresHours: 24, createdAt: null }
    ];

    const initialSettings = {
      names: { lui: 'Lui 👨', lei: 'Lei 👩' },
      lui: {
        pin: '1234',
        attemptsPerTurn: 1,
        enableCountdown: true,
        defaultHours: 24,
        nextDrawTime: ''
      },
      lei: {
        pin: '5678',
        attemptsPerTurn: 1,
        enableCountdown: true,
        defaultHours: 24,
        nextDrawTime: ''
      }
    };

    function App() {
      const [tickets, setTickets] = useState(initialTickets);
      const [drawnTickets, setDrawnTickets] = useState([]);
      const [settings, setSettings] = useState(initialSettings);
      const [isCloudSyncing, setIsCloudSyncing] = useState(false);

      const [activePlayer, setActivePlayer] = useState('lui'); 
      const [usedAttempts, setUsedAttempts] = useState({ lui: 0, lei: 0 });
      const [currentView, setCurrentView] = useState('main');

      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');
      const [targetSettingsUser, setTargetSettingsUser] = useState(null);

      const [isShaking, setIsShaking] = useState(false);
      const [drawnResult, setDrawnResult] = useState(null);
      const [showResetConfirm, setShowResetConfirm] = useState(false);

      // --- SINCRONIZZAZIONE FIREBASE ---
      useEffect(() => {
        const unsubTickets = db.collection('barattolo_data').doc('tickets')
          .onSnapshot(doc => {
            if (doc.exists && doc.data().list) {
              setTickets(doc.data().list);
            } else {
              db.collection('barattolo_data').doc('tickets').set({ list: initialTickets });
            }
            setIsCloudSyncing(true);
          }, err => console.log('Errore sync tickets:', err));

        const unsubDrawn = db.collection('barattolo_data').doc('drawn')
          .onSnapshot(doc => {
            if (doc.exists && doc.data().list) {
              setDrawnTickets(doc.data().list);
            } else {
              db.collection('barattolo_data').doc('drawn').set({ list: [] });
            }
          }, err => console.log('Errore sync drawn:', err));

        const unsubSettings = db.collection('barattolo_data').doc('settings')
          .onSnapshot(doc => {
            if (doc.exists && doc.data().config) {
              setSettings(doc.data().config);
            } else {
              db.collection('barattolo_data').doc('settings').set({ config: initialSettings });
            }
          }, err => console.log('Errore sync settings:', err));

        return () => {
          unsubTickets();
          unsubDrawn();
          unsubSettings();
        };
      }, []);

      const syncTicketsToFirebase = (newList) => {
        setTickets(newList);
        db.collection('barattolo_data').doc('tickets').set({ list: newList });
      };

      const syncDrawnToFirebase = (newList) => {
        setDrawnTickets(newList);
        db.collection('barattolo_data').doc('drawn').set({ list: newList });
      };

      const syncSettingsToFirebase = (newConfig) => {
        setSettings(newConfig);
        db.collection('barattolo_data').doc('settings').set({ config: newConfig });
      };

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentView, drawnResult, activePlayer, settings, showResetConfirm]);

      const availableForLui = tickets.filter(t => t.target === 'lui' && !drawnTickets.some(d => d.id === t.id));
      const availableForLei = tickets.filter(t => t.target === 'lei' && !drawnTickets.some(d => d.id === t.id));

      // Se gioca Lui, si usano le regole che Lei ha impostato per lui (e viceversa)
      const activeAuthor = activePlayer === 'lui' ? 'lei' : 'lui';
      const maxAttempts = settings[activeAuthor]?.attemptsPerTurn || 1;
      const currentUsed = usedAttempts[activePlayer];
      const remainingAttempts = Math.max(0, maxAttempts - currentUsed);

      const nameLui = settings.names?.lui || 'Lui';
      const nameLei = settings.names?.lei || 'Lei';
      const currentActiveName = activePlayer === 'lui' ? nameLui : nameLei;

      // Il timer della prossima estrazione per chi sta giocando
      const activePlayerSettings = settings[activePlayer] || {};
      const nextDrawTimeStr = activePlayerSettings.nextDrawTime;
      const isNextDrawLocked = nextDrawTimeStr && new Date(nextDrawTimeStr).getTime() > Date.now();

      const handleDrawTicket = () => {
        if (isNextDrawLocked) {
          alert(`Non puoi ancora estrarre! C'è un countdown di sblocco attivo per ${currentActiveName}.`);
          return;
        }

        if (remainingAttempts <= 0) {
          alert(`Hai esaurito i tuoi ${maxAttempts} tentativi disponibili per questa sessione!`);
          return;
        }

        const pool = activePlayer === 'lui' ? availableForLui : availableForLei;
        if (pool.length === 0) {
          alert(`Non ci sono più bigliettini nel barattolo per ${currentActiveName}! Aggiungetene altri nelle Impostazioni.`);
          return;
        }

        setIsShaking(true);

        setTimeout(() => {
          setIsShaking(false);
          const randomIndex = Math.floor(Math.random() * pool.length);
          const selected = pool[randomIndex];

          const authorConfig = settings[selected.createdBy];
          const hasTimer = authorConfig?.enableCountdown;
          const hours = selected.expiresHours || authorConfig?.defaultHours || 24;

          const drawnItem = {
            ...selected,
            drawnBy: activePlayer,
            drawnAt: new Date().toISOString(),
            expiresAt: hasTimer ? new Date(Date.now() + hours * 3600 * 1000).toISOString() : null,
            completed: false
          };

          const newDrawn = [drawnItem, ...drawnTickets];
          syncDrawnToFirebase(newDrawn);
          setDrawnResult(drawnItem);
          setUsedAttempts(prev => ({ ...prev, [activePlayer]: prev[activePlayer] + 1 }));

          if (window.confetti) {
            window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
          }
        }, 900);
      };

      const handlePinSubmit = (userKey) => {
        if (pinInput === settings[userKey]?.pin) {
          setCurrentView(`settings_${userKey}`);
          setTargetSettingsUser(null);
          setPinInput('');
          setPinError('');
        } else {
          setPinError('PIN errato! Riprova.');
          setPinInput('');
        }
      };

      const confirmResetAttempts = () => {
        setUsedAttempts({ lui: 0, lei: 0 });
        setShowResetConfirm(false);
      };

      return (
        <div className="flex flex-col min-h-screen max-w-md mx-auto w-full px-4 py-6">
          
          {/* HEADER */}
          <header className="flex justify-between items-center mb-4 bg-slate-900/60 p-3 rounded-2xl border border-white/10 backdrop-blur-md relative">
            <button 
              onClick={() => setCurrentView('main')}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold text-sm transition ${currentView === 'main' ? 'bg-pink-600 text-white shadow-lg' : 'text-slate-300 hover:text-white'}`}
            >
              <i data-lucide="sparkles" className="w-4 h-4"></i>
              Barattolo
            </button>

            <button 
              onClick={() => setCurrentView('promemoria')}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold text-sm transition relative ${currentView === 'promemoria' ? 'bg-pink-600 text-white shadow-lg' : 'text-slate-300 hover:text-white'}`}
            >
              <i data-lucide="bookmark" className="w-4 h-4"></i>
              Promemoria
              {drawnTickets.filter(d => !d.completed).length > 0 && (
                <span className="bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-black">
                  {drawnTickets.filter(d => !d.completed).length}
                </span>
              )}
            </button>

            <button 
              onClick={() => setCurrentView('settings_select')}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold text-sm transition ${currentView.startsWith('settings') ? 'bg-pink-600 text-white shadow-lg' : 'text-slate-300 hover:text-white'}`}
            >
              <i data-lucide="settings" className="w-4 h-4"></i>
              Impostazioni
            </button>

            <div className="absolute -top-1 -right-1 flex items-center" title={isCloudSyncing ? "Connesso a Firebase Cloud" : "Connessione Cloud in corso..."}>
              <span className={`w-2.5 h-2.5 rounded-full ${isCloudSyncing ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
            </div>
          </header>

          {/* VIEWS */}
          {currentView === 'main' && (
            <MainJarView 
              activePlayer={activePlayer}
              setActivePlayer={setActivePlayer}
              isShaking={isShaking}
              handleDrawTicket={handleDrawTicket}
              availableForLui={availableForLui}
              availableForLei={availableForLei}
              remainingAttempts={remainingAttempts}
              maxAttempts={maxAttempts}
              onRequestReset={() => setShowResetConfirm(true)}
              nameLui={nameLui}
              nameLei={nameLei}
              settings={settings}
            />
          )}

          {currentView === 'promemoria' && (
            <PromemoriaView 
              drawnTickets={drawnTickets}
              syncDrawnToFirebase={syncDrawnToFirebase}
              nameLui={nameLui}
              nameLei={nameLei}
            />
          )}

          {currentView === 'settings_select' && (
            <SettingsSelectView 
              setTargetSettingsUser={setTargetSettingsUser}
              settings={settings}
              syncSettingsToFirebase={syncSettingsToFirebase}
              nameLui={nameLui}
              nameLei={nameLei}
            />
          )}

          {currentView === 'settings_lui' && (
            <PartnerSettingsEditor 
              userKey="lui"
              partnerName={nameLui}
              targetName={nameLei}
              ticketColor="bg-blue-600"
              ticketBadge={`Biglietti BLU per ${nameLei}`}
              settings={settings}
              syncSettingsToFirebase={syncSettingsToFirebase}
              tickets={tickets}
              syncTicketsToFirebase={syncTicketsToFirebase}
              onBack={() => setCurrentView('main')}
            />
          )}

          {currentView === 'settings_lei' && (
            <PartnerSettingsEditor 
              userKey="lei"
              partnerName={nameLei}
              targetName={nameLui}
              ticketColor="bg-red-600"
              ticketBadge={`Biglietti ROSSI per ${nameLui}`}
              settings={settings}
              syncSettingsToFirebase={syncSettingsToFirebase}
              tickets={tickets}
              syncTicketsToFirebase={syncTicketsToFirebase}
              onBack={() => setCurrentView('main')}
            />
          )}

          {/* MODAL RESET CONFIRMATION */}
          {showResetConfirm && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-xs text-center shadow-2xl">
                <div className="w-12 h-12 mx-auto rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center mb-3">
                  <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                </div>
                <h3 className="text-lg font-fredoka font-bold text-white mb-2">Azzera Tentativi?</h3>
                <p className="text-xs text-slate-300 mb-5">
                  Sei sicuro di voler azzerare i tentativi usati in questo turno per entrambi?
                </p>
                <div className="flex gap-2">
                  <button 
                    onClick={() => setShowResetConfirm(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-sm hover:bg-slate-700"
                  >
                    Annulla
                  </button>
                  <button 
                    onClick={confirmResetAttempts}
                    className="flex-1 py-2.5 rounded-xl bg-pink-600 text-white font-bold text-sm hover:bg-pink-500 shadow-lg"
                  >
                    Sì, Azzera
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PIN MODAL */}
          {targetSettingsUser && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-xs text-center shadow-2xl">
                <div className="w-14 h-14 mx-auto rounded-full bg-pink-500/20 text-pink-400 flex items-center justify-center mb-3">
                  <i data-lucide="lock" className="w-7 h-7"></i>
                </div>
                <h3 className="text-xl font-fredoka font-bold text-white mb-1">
                  Area Privata di {targetSettingsUser === 'lui' ? nameLui : nameLei}
                </h3>
                <p className="text-xs text-slate-400 mb-4">Inserisci il PIN per accedere</p>

                <input 
                  type="password"
                  maxLength={4}
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  placeholder="PIN"
                  className="w-full text-center text-2xl tracking-widest bg-slate-800 border border-slate-600 rounded-xl py-2 mb-2 text-white focus:outline-none focus:border-pink-500"
                />

                {pinError && <p className="text-red-400 text-xs mb-3">{pinError}</p>}

                <div className="flex gap-2 mt-2">
                  <button 
                    onClick={() => { setTargetSettingsUser(null); setPinInput(''); setPinError(''); }}
                    className="flex-1 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-sm hover:bg-slate-700"
                  >
                    Annulla
                  </button>
                  <button 
                    onClick={() => handlePinSubmit(targetSettingsUser)}
                    className="flex-1 py-2 rounded-xl bg-pink-600 text-white font-bold text-sm hover:bg-pink-500 shadow-lg"
                  >
                    Sblocca
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* RESULT MODAL */}
          {drawnResult && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-pink-500/50 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl relative overflow-hidden">
                <div className={`absolute top-0 left-0 right-0 h-3 ${drawnResult.target === 'lui' ? 'bg-red-500' : 'bg-blue-500'}`}></div>
                
                <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-3 ${drawnResult.target === 'lui' ? 'bg-red-500/20 text-red-300 border border-red-500/40' : 'bg-blue-500/20 text-blue-300 border border-blue-500/40'}`}>
                  {drawnResult.target === 'lui' ? `Biglietto per ${nameLui} (Rosso)` : `Biglietto per ${nameLei} (Blu)`}
                </span>

                <h3 className="text-2xl font-fredoka font-bold text-white mb-3">🎉 Hai Estratto:</h3>
                
                <div className="bg-slate-800/80 p-4 rounded-2xl border border-white/10 mb-4">
                  <p className="text-lg font-medium text-slate-100">{drawnResult.text}</p>
                </div>

                <div className="bg-red-950/40 border border-red-500/30 p-3 rounded-2xl mb-5 text-left">
                  <p className="text-xs font-bold text-red-400 uppercase tracking-wider mb-1 flex items-center gap-1">
                    <i data-lucide="alert-circle" className="w-3.5 h-3.5"></i>
                    Penitenza in caso di ritardo:
                  </p>
                  <p className="text-sm text-slate-300">{drawnResult.penalty || 'Nessuna penitenza.'}</p>
                </div>

                <button 
                  onClick={() => setDrawnResult(null)}
                  className="w-full py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-600 text-white font-bold text-base shadow-lg hover:brightness-110 active:scale-95 transition"
                >
                  Ho capito, accetto la sfida! 🔥
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- LIVE DRAW TIMER COMPONENT ---
    function LiveDrawTimer({ targetTime, label }) {
      const [timeLeft, setTimeLeft] = useState('');
      const [isUnlocked, setIsUnlocked] = useState(false);

      useEffect(() => {
        if (!targetTime) return;

        const updateTimer = () => {
          const target = new Date(targetTime).getTime();
          const now = new Date().getTime();
          const diff = target - now;

          if (diff <= 0) {
            setIsUnlocked(true);
            setTimeLeft('PRONTO ALL\'ESTRAZIONE!');
          } else {
            setIsUnlocked(false);
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            const daysStr = d > 0 ? `${d}d ` : '';
            setTimeLeft(`${daysStr}${h}h ${m}m ${s}s`);
          }
        };

        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [targetTime]);

      if (!targetTime) return null;

      const formattedTarget = new Date(targetTime).toLocaleString('it-IT', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
      });

      return (
        <div className={`mt-2 p-2 rounded-xl text-xs flex flex-col items-center gap-0.5 border ${
          isUnlocked 
            ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-300' 
            : 'bg-amber-950/60 border-amber-500/40 text-amber-300'
        }`}>
          <div className="flex items-center gap-1 font-bold">
            <i data-lucide={isUnlocked ? "unlock" : "lock"} className="w-3.5 h-3.5"></i>
            <span>{label}: {isUnlocked ? 'Sbloccato!' : `Sblocco il ${formattedTarget}`}</span>
          </div>
          {!isUnlocked && (
            <span className="font-mono text-sm font-black text-amber-200 tracking-wider">{timeLeft}</span>
          )}
        </div>
      );
    }

    // --- MAIN JAR VIEW ---
    function MainJarView({ 
      activePlayer, 
      setActivePlayer, 
      isShaking, 
      handleDrawTicket, 
      availableForLui, 
      availableForLei,
      remainingAttempts,
      maxAttempts,
      onRequestReset,
      nameLui,
      nameLei,
      settings
    }) {
      const activePlayerSettings = settings[activePlayer] || {};
      const nextDrawTimeStr = activePlayerSettings.nextDrawTime;
      const isLockedByTime = nextDrawTimeStr && new Date(nextDrawTimeStr).getTime() > Date.now();

      return (
        <div className="flex-grow flex flex-col items-center justify-between py-2">
          
          {/* PLAYER SELECTOR SWITCH */}
          <div className="w-full bg-slate-900/80 border border-slate-700/80 p-1.5 rounded-2xl flex gap-1 mb-2 shadow-inner">
            <button
              onClick={() => setActivePlayer('lui')}

    function PromemoriaView({ drawnTickets, syncDrawnToFirebase, nameLui, nameLei }) {
      const markAsCompleted = (id) => {
        const updated = drawnTickets.map(item => item.id === id ? { ...item, completed: true } : item);

      const removeDrawn = (id) => {
        if (confirm('Vuoi rimuovere questo biglietto dai promemoria?')) {

          syncDrawnToFirebase(updated);

      return (

          {drawnTickets.length === 0 ? (
            <div className="flex-grow flex flex-col items-center justify-center text-center text-slate-400 py-12">

            </div>
          ) : (
            <div className="space-y-3 overflow-y-auto max-h-[70vh] pr-1">
              {drawnTickets.map(ticket => (
                <TicketCard 
                  key={ticket.id} 
                  ticket={ticket} 
                  onComplete={() => markAsCompleted(ticket.id)}
                  onDelete={() => removeDrawn(ticket.id)}

                  nameLei={nameLei}
                />

          )}

      );

    function TicketCard({ ticket, onComplete, onDelete, nameLui, nameLei }) {
      const [timeLeft, setTimeLeft] = useState('');
      const [isExpired, setIsExpired] = useState(false);

      useEffect(() => {
        if (!ticket.expiresAt || ticket.completed) return;

        const updateTimer = () => {
          const now = new Date().getTime();
          const expireTime = new Date(ticket.expiresAt).getTime();
          const diff = expireTime - now;

          if (diff <= 0) {
            setIsExpired(true);
            setTimeLeft('SCADUTO!');
          } else {
            const h = Math.floor(diff / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            setTimeLeft(`${h}h ${m}m ${s}s`);
          }
        };

        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [ticket]);

      return (
        <div className={`p-4 rounded-2xl border transition relative overflow-hidden ${
          ticket.completed 
            ? 'bg-slate-900/50 border-slate-800 opacity-60' 
            : isExpired 
              ? 'bg-red-950/60 border-red-500/80 shadow-lg' 
              : 'bg-slate-800/80 border-slate-700'
        }`}>
          <div className="flex justify-between items-start mb-2">
            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${
              ticket.target === 'lui' ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-blue-500/20 text-blue-300 border border-blue-500/30'
            }`}>
              {ticket.target === 'lui' ? `Estratto da ${nameLui}` : `Estratto da ${nameLei}`}
            </span>

            {ticket.completed ? (
              <span className="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                <i data-lucide="check-circle" className="w-3 h-3"></i> Completato
              </span>
            ) : isExpired ? (
              <span className="text-[10px] bg-red-600 text-white font-black px-2 py-0.5 rounded-full animate-pulse flex items-center gap-1">
                <i data-lucide="alert-triangle" className="w-3 h-3"></i> PENITENZA ATTIVA
              </span>
            ) : ticket.expiresAt ? (
              <span className="text-[10px] bg-amber-500/20 text-amber-300 font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                <i data-lucide="clock" className="w-3 h-3"></i> {timeLeft}
              </span>
            ) : (
              <span className="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">
                Senza Scadenza
              </span>
            )}
          </div>

          <p className={`text-base font-medium mb-3 ${ticket.completed ? 'line-through text-slate-400' : 'text-slate-100'}`}>
            {ticket.text}
          </p>

          {isExpired && !ticket.completed && (
            <div className="bg-red-900/60 border border-red-500/50 p-2.5 rounded-xl mb-3">
              <p className="text-[11px] font-bold text-red-300 uppercase flex items-center gap-1 mb-0.5">
                <i data-lucide="flame" className="w-3.5 h-3.5"></i> Penitenza da Scontare:
              </p>
              <p className="text-xs text-white font-semibold">{ticket.penalty || 'Esegui la penitenza del partner!'}</p>
            </div>
          )}

          <div className="flex justify-between items-center pt-2 border-t border-white/5">
            <button onClick={onDelete} className="text-xs text-slate-500 hover:text-red-400 flex items-center gap-1">
              <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Elimina
            </button>

            {!ticket.completed && (
              <button 
                onClick={onComplete}
                className="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow"
              >
                <i data-lucide="check" className="w-3.5 h-3.5"></i> Segna Completato
              </button>
            )}
          </div>
        </div>
      );
    }

    // --- PARTNER SETTINGS EDITOR ---
    function PartnerSettingsEditor({ 
      userKey, 
      partnerName, 
      targetName, 
      ticketColor, 
      ticketBadge, 
      settings, 
      syncSettingsToFirebase, 
      tickets, 
      syncTicketsToFirebase, 
      onBack 
    }) {
      const userSettings = settings[userKey] || {};
      
      // Il target del timer (se sta modificando Lui 'lui', modifica il timer per Lei 'lei')
      const targetUserKey = userKey === 'lui' ? 'lei' : 'lui';
      const targetUserSettings = settings[targetUserKey] || {};

      const [newText, setNewText] = useState('');
      const [newPenalty, setNewPenalty] = useState('');
      const [newHours, setNewHours] = useState(userSettings.defaultHours || 24);
      const [newPin, setNewPin] = useState(userSettings.pin || '1234');
      const [nextDrawDateTime, setNextDrawDateTime] = useState(targetUserSettings.nextDrawTime || '');

      const updateConfig = (key, value) => {
        const updated = {
          ...settings,
          [userKey]: { ...settings[userKey], [key]: value }
        };
        syncSettingsToFirebase(updated);
      };

      // Funzione specifica per impostare il timer di estrazione DELL'ALTRO partner
      const updateTargetDrawTime = (val) => {
        setNextDrawDateTime(val);
        const updated = {
          ...settings,
          [targetUserKey]: { ...settings[targetUserKey], nextDrawTime: val }
        };
        syncSettingsToFirebase(updated);
      };

      const handleAddTicket = (e) => {
        e.preventDefault();
        if (!newText.trim()) return;

        const targetUser = userKey === 'lui' ? 'lei' : 'lui';

        const newTicketObj = {
          id: Date.now().toString(),
          createdBy: userKey,
          target: targetUser,
          text: newText.trim(),
          penalty: newPenalty.trim() || 'Nessuna penitenza stabilita',
          expiresHours: parseInt(newHours) || userSettings.defaultHours || 24
        };

        syncTicketsToFirebase([...tickets, newTicketObj]);
        setNewText('');
        setNewPenalty('');
      };

      const handleDeleteTicket = (id) => {
        syncTicketsToFirebase(tickets.filter(t => t.id !== id));
      };

      const myTickets = tickets.filter(t => t.createdBy === userKey);

      return (
        <div className="flex-grow flex flex-col space-y-5 pb-6">
          
          <div className="flex items-center justify-between pb-2 border-b border-white/10">
            <div>
              <h2 className="text-xl font-fredoka font-bold text-white">Area Gestione {partnerName}</h2>
              <span className={`text-[10px] px-2 py-0.5 rounded-full text-white font-bold ${ticketColor}`}>
                {ticketBadge}

            </div>

              Chiudi

                <p className="text-xs font-semibold text-white">Tentativi per turno</p>
                <p className="text-[10px] text-slate-400">Quanti biglietti può pescare {targetName}</p>
              </div>
              <select 
                value={userSettings.attemptsPerTurn || 1}
                onChange={(e) => updateConfig('attemptsPerTurn', parseInt(e.target.value))}
                className="bg-slate-800 text-white text-sm font-bold px-3 py-1.5 rounded-xl border border-slate-600 focus:outline-none"
              >
                <option value={1}>1 tentativo</option>
                <option value={2}>2 tentativi</option>
                <option value={3}>3 tentativi</option>
              </select>
            </div>

            {/* Countdown / Data orario sblocco estrazione per l'altro partner */}

                </div>

            ) : (
              myTickets.map(t => (
                <div key={t.id} className="p-3 bg-slate-800/60 rounded-xl border border-slate-700 flex justify-between items-start gap-2">
                  <div>
                    <p className="text-sm font-medium text-slate-200">{t.text}</p>
                    <p className="text-[11px] text-red-400 mt-0.5">Penitenza: {t.penalty}</p>
                    <p className="text-[10px] text-slate-400 mt-0.5">Scadenza: {t.expiresHours} ore</p>
                  </div>
                  <button 
                    onClick={() => handleDeleteTicket(t.id)}
                    className="text-slate-500 hover:text-red-400 p-1"
                  >
                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                  </button>
                </div>
              ))
            )}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
